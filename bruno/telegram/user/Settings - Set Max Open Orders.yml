info:
  name: Settings - Set Max Open Orders
  type: http
  seq: 11

http:
  method: POST
  url: "{{url}}/v1/telegram/{{process.env.telegram_user_id}}/settings/max-open-orders"
  body:
    type: json
    data: |-
      {
        "max_open_orders": 3
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
