info:
  name: Set Max Open Orders
  type: http
  seq: 12

http:
  method: POST
  url: "{{url}}/admin/settings/max-open-orders"
  body:
    type: json
    data: |-
      {
        "max_open_orders": 5
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
